stages:
  - test
  - deploy

variables:
  NODE_IMAGE: node:22-alpine
  DEPLOY_BRANCH: "main"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .yarn/cache/

test:
  stage: test
  image: $NODE_IMAGE
  tags:
    - vps
  before_script:
    - yarn install --frozen-lockfile
  script:
    - yarn lint
    - yarn build
  rules:
    - if: '$CI_COMMIT_BRANCH'

deploy:
  stage: deploy
  image: alpine:3.20
  tags:
    - vps
  before_script:
    - apk add --no-cache openssh-client git
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -T 10 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - >
      ssh -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST"
      "cd '$FRONTEND_DEPLOY_PATH' &&
      git fetch origin &&
      git checkout '$DEPLOY_BRANCH' &&
      git pull origin '$DEPLOY_BRANCH' &&
      yarn install --frozen-lockfile &&
      yarn build"
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_BRANCH'
