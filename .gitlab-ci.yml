stages:
  - build
  - deploy

variables:
  NODE_IMAGE: node:22-alpine
  DEPLOY_BRANCH: 'main'
  NEXT_PUBLIC_API_BASE_URL: 'https://api.worktracker.ovrin.uz'

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .yarn/cache/
    - .next/cache/

build:
  stage: build
  image: $NODE_IMAGE
  tags:
    - vps
  before_script:
    - yarn install --frozen-lockfile
  script:
    - yarn lint
    - yarn build
  artifacts:
    paths:
      - out/
    expire_in: 1 hour
  rules:
    - if: '$CI_COMMIT_BRANCH'

deploy:
  stage: deploy
  image: alpine:3.20
  tags:
    - vps
  dependencies:
    - build
  before_script:
    - apk add --no-cache openssh-client rsync
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -T 10 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - rsync -avz --delete out/ "$DEPLOY_USER@$DEPLOY_HOST:$FRONTEND_DEPLOY_PATH/"
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_BRANCH == $DEPLOY_BRANCH'
